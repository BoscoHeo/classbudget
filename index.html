<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>학급비 영수증 자동 정리</title>
  <meta name="description" content="교사를 위한 학급비 영수증 관리 및 NEIS 정산 도구" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/index.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/pages.css" />
</head>
<body>
  <!-- PIN Overlay -->
  <div class="pin-overlay" id="pin-overlay" style="display:none;">
    <div class="pin-card">
      <div class="pin-card__icon">☁️</div>
      <h1 class="pin-card__title">학급비 정리</h1>
      <p class="pin-card__subtitle">클라우드 동기화로 데이터를 안전하게 보관합니다</p>
      
      <div class="pin-card__form">
        <label class="pin-card__label" for="pin-input">접속 코드 (PIN)</label>
        <input type="password" id="pin-input" class="pin-card__input" placeholder="4~8자리 입력" maxlength="8" autocomplete="off">
        <div class="pin-card__error" id="pin-error" style="display:none;"></div>
      </div>
      
      <div class="pin-card__actions">
        <button class="btn btn--primary btn--lg" id="btn-pin-access" style="flex:1;">🔑 접속하기</button>
        <button class="btn btn--success btn--lg" id="btn-pin-create" style="flex:1;">✨ 새로 만들기</button>
      </div>
      
      <button class="pin-card__skip" id="btn-pin-skip">오프라인으로 사용하기 →</button>
    </div>
  </div>

  <!-- Navigation -->
  <nav class="nav" id="main-nav">
    <div class="nav__inner">
      <a href="#/" class="nav__logo" id="nav-logo">
        <span class="nav__logo-icon">📋</span>
        <span class="nav__logo-text">학급비 정리</span>
      </a>
      <div class="nav__links">
        <a href="#/" class="nav__link" data-page="dashboard" id="nav-dashboard">대시보드</a>
        <a href="#/add" class="nav__link" data-page="add" id="nav-add">영수증 등록</a>
        <a href="#/list" class="nav__link" data-page="list" id="nav-list">영수증 목록</a>
        <a href="#/settings" class="nav__link" data-page="settings" id="nav-settings">설정</a>
      </div>
      <div class="sync-indicator" id="sync-indicator" title="클라우드 동기화">☁️</div>
    </div>
  </nav>

  <!-- Main Content -->
  <main class="main" id="app">
    <!-- Pages will be rendered here by the router -->
  </main>

  <!-- Toast Container -->
  <div class="toast-container" id="toast-container"></div>

  <!-- Scripts -->
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/firebase-sync.js"></script>
  <script src="js/excel-export.js"></script>
  <script src="js/pages.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
